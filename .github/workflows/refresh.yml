name: Refresh watchlist
on:
  workflow_dispatch:
    inputs:
      user_id:
        description: Account UUID to refresh
        required: true
        type: string
      force:
        description: Bypass the daily cache for a manual refresh
        required: false
        default: "true"
        type: string
permissions:
  contents: read
concurrency:
  group: watchlist-maintenance
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.WATCHLIST_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build current screening data
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run build-data
      - name: Refresh requested watchlist
        env:
          POSTHOG_ENABLED: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WATCHLIST_USER_ID: ${{ inputs.user_id }}
          WATCHLIST_FORCE: ${{ inputs.force }}
        run: npm run watchlists:refresh
