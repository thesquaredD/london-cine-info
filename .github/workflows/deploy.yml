name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "45 6,11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Changelog dates come from the commit that added each fragment.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build fixture screening data
        run: npm run build-data -- --fixture
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build screening data
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run build-data
      - run: npm run build
      - name: Apply account migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply london-cine-info --remote
      - name: Deploy to Cloudflare Pages
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist --project-name london-cine-info --branch main | tee pages-deploy.log
          url=$(grep -oE 'https://[a-z0-9]+\.london-cine-info\.pages\.dev' pages-deploy.log | tail -n 1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "id=$(echo "${url#https://}" | cut -d. -f1)" >> "$GITHUB_OUTPUT"
      # The app and its changelog ship together; this proves production serves this revision.
      - name: Verify the live revision and changelog
        env:
          DEPLOYMENT_ID: ${{ steps.pages.outputs.id }}
          DEPLOYMENT_URL: ${{ steps.pages.outputs.url }}
          VERIFY_URLS: ${{ steps.pages.outputs.url }} https://london-cine.info
        run: npm run deployment:verify
      - name: Keep the deployment receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-receipt.json
          retention-days: 90

  accounts:
    needs: deploy
    if: vars.WATCHLIST_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: watchlist-maintenance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build current screening data
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run build-data
      - name: Refresh watchlists
        id: sync
        continue-on-error: true
        env:
          POSTHOG_ENABLED: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run watchlists:refresh
      - name: Send weekly screening emails
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: npm run digests:send
      - name: Report watchlist import failures
        if: steps.sync.outcome == 'failure'
        run: exit 1
